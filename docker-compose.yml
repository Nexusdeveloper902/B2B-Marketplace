# Presence Platform — Marketplace Storefront
#
# One-command deployment:
#   docker compose up -d --build
# The storefront is then served on http://localhost:8080 (override the
# published port with APP_PORT=3000 docker compose up -d).
#
# The app is STATELESS (ADR-013): no database, no volumes. Contact requests
# are written to the application log (`docker compose logs storefront`),
# not persisted.

name: presence-platform-storefront

services:
  storefront:
    build:
      context: .
      dockerfile: Dockerfile
    image: presence-platform-storefront
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    restart: unless-stopped
    # php:apache images ship no curl/wget binary, so the healthcheck uses
    # the PHP CLI against Laravel's /up health route.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
