# Presence Platform storefront — single vhost, document root in public/.
# Routing is handled by public/.htaccess (mod_rewrite), so this file only
# needs to point Apache at public/ and allow that override.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
