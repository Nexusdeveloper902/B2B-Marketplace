# Presence Platform storefront — Vercel vhost.
#
# The {{PORT}} placeholder is replaced with the value of $PORT by the
# entrypoint at container start. Apache's Listen directive cannot read
# environment variables at parse time, so we template the value at runtime
# rather than trying to use ${PORT} here.
#
# Routing is handled by public/.htaccess (mod_rewrite), so this vhost only
# needs to point Apache at public/ and allow that override. Identical
# DocumentRoot + directory policy to docker/apache/vhost.conf used by the
# Render Dockerfile — only the port differs.

Listen {{PORT}}

<VirtualHost *:{{PORT}}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
