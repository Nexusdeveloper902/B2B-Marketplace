; OPcache for production: the application code is immutable once the image
; is built, so timestamp re-validation is switched off and the cache cannot
; go stale. php:apache images already load the extension via
; docker-php-ext-install; this file only tunes it.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
